<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>TPIB — English Vocabulary</title>
<style>
:root{--bg:#f4f6fb;--panel:#fff;--ink:#182033;--muted:#687386;--accent:#5267e8;--line:#e6e9f1}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans Lao",sans-serif}
header{background:#111827;color:white;padding:22px 18px 26px;border-radius:0 0 24px 24px}
.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:27px;font-weight:800;letter-spacing:1px}.tag{font-size:12px;background:#273449;padding:7px 10px;border-radius:20px;color:#cbd5e1}
header p{color:#cbd5e1;margin:7px 0 17px;font-size:13px}
.search{width:100%;padding:14px 15px;border:0;border-radius:12px;font-size:16px;outline:none}
main{max-width:760px;margin:auto;padding:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 15px}
.stat,.panel,.word{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px}
.stat b{font-size:20px;display:block}.stat span{font-size:12px;color:var(--muted)}
h2{font-size:17px;margin:20px 2px 10px}
.filters{display:flex;gap:8px;overflow:auto;padding-bottom:8px}
.filters button,.actions button,.toolbar button{border:1px solid var(--line);background:white;color:var(--ink);padding:9px 12px;border-radius:10px;white-space:nowrap}
.filters button.active,.primary{background:var(--accent)!important;color:white!important;border-color:var(--accent)!important}
.word{margin-bottom:10px}.wordtop{display:flex;justify-content:space-between;gap:10px;align-items:center}
.word h3{font-size:21px;margin:0}.type{font-size:11px;background:#eef0ff;color:#4b5ed1;padding:5px 8px;border-radius:20px}
.pron{color:#5267e8;margin:7px 0 3px;font-size:14px}.meaning{margin:0;color:#39445a}
.actions{display:flex;gap:8px;margin-top:12px}.actions button{font-size:13px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.toolbar button{font-size:13px}
.empty{text-align:center;color:var(--muted);padding:25px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:25px}
input[type=file]{display:none}
#quizBox{display:none}.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<header>
 <div class="top"><div class="brand">TPIB</div><div class="tag">ENGLISH • LAO</div></div>
 <p>Learn English vocabulary — words, meanings & pronunciation</p>
 <input id="search" class="search" placeholder="ຄົ້ນຫາຄຳສັບ English / ພາສາລາວ..." oninput="render()">
</header>
<main>
 <section class="stats">
  <div class="stat"><b id="total">0</b><span>ຄຳສັບ</span></div>
  <div class="stat"><b id="favCount">0</b><span>ຄຳທີ່ມັກ</span></div>
  <div class="stat"><b id="shown">0</b><span>ຜົນການຄົ້ນຫາ</span></div>
 </section>
 <div class="toolbar">
  <button onclick="showAll()">ຄຳສັບທັງໝົດ</button>
  <button onclick="showFavorites()">★ ຄຳທີ່ມັກ</button>
  <button onclick="startQuiz()">ເລີ່ມ Quiz</button>
  <button onclick="document.getElementById('file').click()">ນຳເຂົ້າ 10,000 ຄຳ</button>
  <input id="file" type="file" accept=".json" onchange="importWords(event)">
 </div>
 <h2>ໝວດຄຳສັບ</h2>
 <div class="filters" id="categories"></div>
 <section id="quizBox" class="panel">
  <b>Vocabulary Quiz</b>
  <p id="question"></p><div id="answers"></div>
  <p id="quizResult" class="small"></p>
  <button class="primary" onclick="nextQuestion()">ຄຳຖາມຕໍ່ໄປ</button>
 </section>
 <h2>ຄຳສັບພາສາອັງກິດ</h2>
 <div id="list"></div>
 <footer>TPIB • English Vocabulary Learning</footer>
</main>
<script>
const starterWords = [
 {en:"Apple",pron:"ແອັບ-ເປິລ",ipa:"/ˈæp.əl/",lo:"ໝາກໂປມ",type:"Noun",cat:"Food"},
 {en:"Book",pron:"ບຸກ",ipa:"/bʊk/",lo:"ປຶ້ມ",type:"Noun",cat:"Daily Life"},
 {en:"Beautiful",pron:"ບິວ-ທິ-ເຟິລ",ipa:"/ˈbjuː.tɪ.fəl/",lo:"ງາມ",type:"Adjective",cat:"Basic"},
 {en:"Water",pron:"ວໍ-ເທີ",ipa:"/ˈwɔː.tər/",lo:"ນ້ຳ",type:"Noun",cat:"Food"},
 {en:"Family",pron:"ແຟມ-ມິ-ລີ",ipa:"/ˈfæm.əl.i/",lo:"ຄອບຄົວ",type:"Noun",cat:"People"},
 {en:"Travel",pron:"ແທຣ-ເວິລ",ipa:"/ˈtræv.əl/",lo:"ເດີນທາງ",type:"Verb/Noun",cat:"Travel"},
 {en:"Mountain",pron:"ເມົານ໌-ທິນ",ipa:"/ˈmaʊn.tən/",lo:"ພູເຂົາ",type:"Noun",cat:"Nature"},
 {en:"Work",pron:"ເວີກ",ipa:"/wɜːrk/",lo:"ເຮັດວຽກ / ວຽກ",type:"Verb/Noun",cat:"Work"},
 {en:"Learn",pron:"ເລີນ",ipa:"/lɜːrn/",lo:"ຮຽນຮູ້",type:"Verb",cat:"Education"},
 {en:"Friend",pron:"ເຟຣນ",ipa:"/frend/",lo:"ໝູ່ / ເພື່ອນ",type:"Noun",cat:"People"},
 {en:"Happy",pron:"ແຮັບ-ພີ",ipa:"/ˈhæp.i/",lo:"ມີຄວາມສຸກ",type:"Adjective",cat:"Feelings"},
 {en:"House",pron:"ເຮົາສ໌",ipa:"/haʊs/",lo:"ເຮືອນ",type:"Noun",cat:"Daily Life"},
 {en:"Computer",pron:"ຄອມ-ພິວ-ເທີ",ipa:"/kəmˈpjuː.tər/",lo:"ຄອມພິວເຕີ",type:"Noun",cat:"Technology"},
 {en:"Beautifully",pron:"ບິວ-ທິ-ເຟິລ-ລີ",ipa:"/ˈbjuː.tɪ.fəl.i/",lo:"ຢ່າງງົດງາມ",type:"Adverb",cat:"Basic"},
 {en:"Teacher",pron:"ທີ-ເຊີ",ipa:"/ˈtiː.tʃər/",lo:"ຄູ / ອາຈານ",type:"Noun",cat:"Education"},
 {en:"Airport",pron:"ແອຣ໌-ພອດ",ipa:"/ˈer.pɔːrt/",lo:"ສະໜາມບິນ",type:"Noun",cat:"Travel"},
 {en:"Environment",pron:"ອິນ-ວາຍ-ເຣິນ-ເມິນ",ipa:"/ɪnˈvaɪ.rən.mənt/",lo:"ສິ່ງແວດລ້ອມ",type:"Noun",cat:"Nature"},
 {en:"Business",pron:"ບິດ-ເນັສ",ipa:"/ˈbɪz.nəs/",lo:"ທຸລະກິດ",type:"Noun",cat:"Work"},
 {en:"Computer science",pron:"ຄອມ-ພິວ-ເທີ ໄຊ-ເອິນສ໌",ipa:"/kəmˈpjuː.tər ˌsaɪ.əns/",lo:"ວິທະຍາການຄອມພິວເຕີ",type:"Noun",cat:"Technology"},
 {en:"Excited",pron:"ອິກ-ໄຊ-ທິດ",ipa:"/ɪkˈsaɪ.tɪd/",lo:"ຕື່ນເຕັ້ນ",type:"Adjective",cat:"Feelings"},
 {en:"Good morning",pron:"ກຸດ-ມໍ-ນິງ",ipa:"/ˌɡʊd ˈmɔːr.nɪŋ/",lo:"ສະບາຍດີຕອນເຊົ້າ",type:"Phrase",cat:"Basic"}
];
let words=[...starterWords], favorites=new Set(), activeCategory="All", favoriteMode=false, quizIndex=0;
const $=id=>document.getElementById(id);
function speak(word){if(!('speechSynthesis' in window)){alert("Browser ນີ້ບໍ່ຮອງຮັບສຽງ");return}let u=new SpeechSynthesisUtterance(word);u.lang="en-US";u.rate=.82;speechSynthesis.cancel();speechSynthesis.speak(u)}
function categories(){let cats=["All",...new Set(words.map(w=>w.cat||"Other"))];$("categories").innerHTML=cats.map(c=>`<button class="${activeCategory===c?'active':''}" onclick="setCategory('${c.replace(/'/g,"\\'")}')">${c==="All"?"ທັງໝົດ":c}</button>`).join("")}
function setCategory(c){activeCategory=c;favoriteMode=false;render()}
function showAll(){favoriteMode=false;activeCategory="All";render()}
function showFavorites(){favoriteMode=true;render()}
function render(){
 categories();let q=$("search").value.trim().toLowerCase();
 let filtered=words.filter(w=>(activeCategory==="All"||w.cat===activeCategory)&&(!favoriteMode||favorites.has(w.en))&&(!q||[w.en,w.lo,w.pron,w.ipa,w.cat].join(" ").toLowerCase().includes(q)));
 $("total").textContent=words.length;$("favCount").textContent=favorites.size;$("shown").textContent=filtered.length;
 $("list").innerHTML=filtered.length?filtered.map(w=>`<article class="word"><div class="wordtop"><h3>${esc(w.en)}</h3><span class="type">${esc(w.type||"Word")}</span></div><div class="pron">ອ່ານ: ${esc(w.pron||"—")} &nbsp; ${esc(w.ipa||"")}</div><p class="meaning">ຄວາມໝາຍ: ${esc(w.lo||"—")}</p><div class="actions"><button class="primary" onclick="speak(${JSON.stringify(w.en)})">🔊 ຟັງສຽງ</button><button onclick="toggleFav(${JSON.stringify(w.en)})">${favorites.has(w.en)?"★ ບັນທຶກແລ້ວ":"☆ ບັນທຶກ"}</button></div></article>`).join(""):'<div class="empty">ບໍ່ພົບຄຳສັບ</div>';
}
function toggleFav(w){favorites.has(w)?favorites.delete(w):favorites.add(w);render()}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function importWords(e){
 const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{let data=JSON.parse(r.result);if(!Array.isArray(data))throw Error("JSON ຕ້ອງເປັນ Array");let cleaned=data.filter(x=>x.en&&x.lo).map(x=>({en:String(x.en),lo:String(x.lo),pron:String(x.pron||""),ipa:String(x.ipa||""),type:String(x.type||"Word"),cat:String(x.cat||"Other")}));words=[...words,...cleaned];render();alert("ນຳເຂົ້າ "+cleaned.length+" ຄຳສຳເລັດ!")}catch(err){alert("ໄຟລ໌ JSON ບໍ່ຖືກຕ້ອງ")}};
 r.readAsText(f);e.target.value="";
}
function startQuiz(){$("quizBox").style.display="block";nextQuestion();$("quizBox").scrollIntoView({behavior:"smooth"})}
function nextQuestion(){
 if(words.length<4){$("question").textContent="ຕ້ອງມີຄຳສັບຢ່າງໜ້ອຍ 4 ຄຳ";return}
 let correct=words[Math.floor(Math.random()*words.length)],opts=[correct];
 while(opts.length<4){let w=words[Math.floor(Math.random()*words.length)];if(!opts.some(x=>x.en===w.en))opts.push(w)}
 opts.sort(()=>Math.random()-.5);$("question").textContent=`"${correct.en}" ແປວ່າຫຍັງ?`;$("quizResult").textContent="";
 $("answers").innerHTML=opts.map(o=>`<button style="display:block;width:100%;margin:7px 0;padding:12px;border:1px solid #e6e9f1;border-radius:10px;background:white;text-align:left" onclick="checkAnswer(this,${JSON.stringify(o.en)},${JSON.stringify(correct.en)},${JSON.stringify(correct.lo)})">${esc(o.lo)}</button>`).join("");
}
function checkAnswer(btn,chosen,correct,meaning){document.querySelectorAll("#answers button").forEach(b=>b.disabled=true);$("quizResult").textContent=chosen===correct?"ຖືກຕ້ອງ! ✓":"ຍັງບໍ່ຖືກ. ຄຳຕອບ: "+meaning}
render();
</script>
</body>
  </html>
