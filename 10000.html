<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocab 1000 - Elementary</title>
<style>
body{font-family:sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);margin:0;padding:12px;min-height:100vh}
h1{text-align:center;color:#fff}
.top{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.top button{padding:12px 18px;border-radius:20px;border:none;font-weight:bold;background:#fff;color:#667eea}
.top button.active{background:#f59e0b;color:#fff}
input{width:92%;padding:13px;font-size:16px;border-radius:20px;border:none;margin:10px 0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.tabs button{padding:8px 12px;border-radius:20px;border:none;background:rgba(255,255,255,.9)}
.tabs button.active{background:#f59e0b;color:#fff}
.card{background:#fff;padding:16px;margin:8px 0;border-radius:18px}
.word{font-size:26px;font-weight:bold;cursor:pointer}
.mean{color:#dc2626;font-size:19px;font-weight:bold}
.ex{color:#64748b}.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;color:#fff;margin-left:6px}
.quiz{background:#fff;padding:20px;border-radius:20px;text-align:center}
.opt{display:block;width:100%;padding:14px;margin:8px 0;border-radius:14px;border:2px solid #e2e8f0;background:#f8fafc;font-size:17px}
.score{color:#fff;text-align:center;font-weight:bold}
.info{color:#fff;text-align:center}
</style>
</head>
<body>
<h1>📚 Vocab 1000</h1>
<div class="info" id="counts">🟢 Beginner: 10 | 🔵 Elementary: 990</div>
<div class="score" id="score">⭐ ຄະແນນ: 0 | 🔥 ຖືກຕິດຕໍ່ກັນ: 0</div>
<div class="top">
<button class="active" onclick="showMode('learn',this)">📖 ຮຽນ</button>
<button onclick="showMode('quiz',this)">🎯 ຕອບຄຳຖາມ</button>
<button onclick="showMode('game',this)">🎮 ເກມ</button>
</div>
<div id="learnBox">
<input id="search" placeholder="🔍 ຄົ້ນຫາ..." oninput="render()">
<div class="tabs" id="levels"></div>
<div id="list">ກຳລັງໂຫຼດ 990 ຄຳ...</div>
</div>
<div id="quizBox" style="display:none"></div>
<script>
let ALL=[];let curLevel=0;let score=0;let streak=0;let curQ=null;let mode='learn';
let cache={};
// Beginner 10 ຄຳ - ແປຖືກ 100%
let BEGINNER=[
["hello","ສະບາຍດີ","Hello, how are you?"],
["goodbye","ລາກ່ອນ","Goodbye, see you."],
["yes","ແມ່ນ","Yes, I do."],
["no","ບໍ່","No, I don't."],
["please","ກະລຸນາ","Please help me."],
["thanks","ຂອບໃຈ","Thanks a lot."],
["sorry","ຂໍໂທດ","Sorry, I am late."],
["one","ໜຶ່ງ","One apple."],
["two","ສອງ","Two apples."],
["three","ສາມ","Three apples."]
];
let DICT={hello:"ສະບາຍດີ",goodbye:"ລາກ່ອນ",yes:"ແມ່ນ",no:"ບໍ່",please:"ກະລຸນາ",thanks:"ຂອບໃຈ",sorry:"ຂໍໂທດ",one:"ໜຶ່ງ",two:"ສອງ",three:"ສາມ",school:"ໂຮງຮຽນ",teacher:"ຄູ",student:"ນັກຮຽນ",book:"ປຶ້ມ",pencil:"ສໍ",dog:"ໝາ",cat:"ແມວ",water:"ນ້ຳ",food:"ອາຫານ",house:"ເຮືອນ",mother:"ແມ່",father:"ພໍ່",friend:"ໝູ່ເພື່ອນ",family:"ຄອບຄົວ",apple:"ໝາກແອັບເປິ້ນ",banana:"ໝາກກ້ວຍ",rice:"ເຂົ້າ",milk:"ນົມ",sun:"ຕາເວັນ",moon:"ເດືອນ",tree:"ຕົ້ນໄມ້",flower:"ດອກໄມ້",bird:"ນົກ",fish:"ປາ"};
function speakText(t){try{let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=0.8;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}setTimeout(()=>{if(!speechSynthesis.speaking){let a=new Audio('https://translate.google.com/translate_tts?ie=UTF-8&q='+encodeURIComponent(t)+'&tl=en&client=tw-ob');a.play().catch(()=>{});}},400);}
async function getLao(w){
  if(DICT[w]) return DICT[w];
  if(cache[w]) return cache[w];
  try{
    let r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(w)+'&langpair=en|lo');
    let j=await r.json();let t=j.responseData.translatedText||'';
    if(t && t.toLowerCase()!==w.toLowerCase()){cache[w]=t;return t;}
  }catch(e){}
  return w;
}
async function load(){
  // Elementary 990 ຄຳ - ເອົາຈາກລາຍຊື່ 1000 ຄຳທີ່ໃຊ້ຫຼາຍສຸດ ແລ້ວຕັດ Beginner 10 ຄຳອອກ
  let words=[];
  try{
    let r=await fetch('https://raw.githubusercontent.com/first20hours/google-10000-english/master/20k.txt');
    let t=await r.text();
    words=t.split('\n').map(s=>s.trim()).filter(w=>/^[a-z]{3,8}$/.test(w));
    // ເອົາແຕ່ຄຳ Elementary ທີ່ໃຊ້ຈິງ ບໍ່ເອົາຄຳແປກໆ
    words=words.filter(w=>!BEGINNER.map(b=>b[0]).includes(w));
    words=words.slice(0,990);
  }catch(e){
    // ຖ້າໂຫຼດບໍ່ໄດ້ ໃຊ້ລາຍຊື່ສຳຮອງ
    words="school teacher student classroom pencil pen book bag desk chair door window board lesson homework exam question answer dog cat bird fish chicken pig cow elephant monkey snake frog butterfly bee ant head eye nose mouth ear hand foot leg arm hair face tooth finger mother father sister brother baby friend family boy girl man woman rice bread egg milk tea coffee fruit apple banana orange mango meat salt sugar breakfast lunch dinner sun moon star sky cloud rain wind flower tree leaf river mountain sea house home kitchen bedroom bathroom table bed lamp clock key car bus bicycle motorbike boat airplane train road market shop hospital doctor money phone computer music song dance sing play game ball run walk jump swim eat drink sleep wake clean hot cold fast slow easy hard beautiful strong tired morning evening today tomorrow yesterday love like help give take come go see hear know think open close buy sell pay watch cook wash smile laugh cry long short high low right wrong new old".split(" ");
    while(words.length<990) words.push(...words.slice(0,990-words.length));
    words=words.slice(0,990);
  }
  ALL=[];
  BEGINNER.forEach((d,i)=>ALL.push({w:d[0],lao:d[1],ex:d[2],cat:"Beginner",level:0}));
  words.forEach((w,i)=>ALL.push({w:w,lao:"",ex:'Example: I use "'+w+'" every day.',cat:"Elementary",level:Math.floor(i/99)+1}));
  document.getElementById('counts').innerText='🟢 Beginner: 10 | 🔵 Elementary: '+words.length+' | ລວມ: '+ALL.length;
  let h=`<button onclick="setLevel(0,this)">🟢 Beginner (10)</button>`;
  for(let i=1;i<=10;i++)h+=`<button onclick="setLevel(${i},this)">🔵 Elementary ${i} (99)</button>`;
  document.getElementById('levels').innerHTML=h;
  render();
}
function showMode(m,b){mode=m;document.querySelectorAll('.top button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('learnBox').style.display=m==='learn'?'block':'none';document.getElementById('quizBox').style.display=m==='learn'?'none':'block';if(m!=='learn')newQuiz();}
function setLevel(l,b){curLevel=l;document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');render();}
async function render(){
let q=document.getElementById('search').value.toLowerCase();
let list=ALL.filter(o=>o.level===curLevel);
if(q)list=ALL.filter(o=>o.w.includes(q));
list=list.slice(0,50);
document.getElementById('list').innerHTML=list.map((o,idx)=>`<div class="card"><div class="word" onclick="speakText('${o.w}')">🔊 ${o.w} <span class="badge" style="background:${o.cat==='Beginner'?'#22c55e':'#2563eb'}">${o.cat}</span></div><div class="mean" id="mean-${idx}">${o.lao? '🇱🇦 '+o.lao : '⏳ ກຳລັງແປ...'}</div><div class="ex">${o.ex}</div></div>`).join('');
for(let idx=0;idx<list.length;idx++){
  if(!list[idx].lao){
    let lao=await getLao(list[idx].w);list[idx].lao=lao;
    let el=document.getElementById('mean-'+idx);if(el)el.innerText='🇱🇦 '+lao;
  }
}
}
async function newQuiz(){
if(ALL.length<4)return;
let pool = mode==='game' ? ALL.filter(o=>o.cat==='Elementary') : ALL;
let idx=Math.floor(Math.random()*pool.length);curQ=pool[idx];
if(!curQ.lao) curQ.lao=await getLao(curQ.w);
let opts=[curQ.lao];
let tries=0;
while(opts.length<4 && tries<20){tries++;let w=pool[Math.floor(Math.random()*pool.length)];let l=w.lao||await getLao(w.w);if(!opts.includes(l))opts.push(l);}
opts.sort(()=>Math.random()-0.5);
document.getElementById('quizBox').innerHTML=`<div class="quiz"><div>${mode==='game'?'🎮 ເກມ Elementary - ທາຍໃຫ້ໄວ!':'🎯 ຕອບຄຳຖາມ'} - ${curQ.cat}</div><h2 style="font-size:32px" onclick="speakText('${curQ.w}')">🔊 ${curQ.w}</h2><p>ຄຳນີ້ແປເປັນລາວວ່າຫຍັງ?</p><p style="color:#64748b">${curQ.ex}</p>${opts.map(o=>`<button class="opt" onclick="checkAns(this,'${o.replace(/'/g,"")}')">${o}</button>`).join('')}<div id="qResult"></div><button style="padding:12px 20px;border:none;border-radius:14px;background:#2563eb;color:#fff;margin-top:10px" onclick="newQuiz()">ຂໍ້ຕໍ່ໄປ ➡️</button></div>`;
speakText(curQ.w);
}
function checkAns(btn,ans){
if(ans===curQ.lao){score+=10;streak++;document.getElementById('qResult').innerHTML='<h3 style="color:green">✅ ຖືກຕ້ອງ! +10 🎉</h3>';speakText('Correct! Great job');}
else{streak=0;document.getElementById('qResult').innerHTML='<h3 style="color:red">❌ ຜິດ! ຄຳຕອບແມ່ນ: '+curQ.lao+'</h3>';}
document.getElementById('score').innerText='⭐ ຄະແນນ: '+score+' | 🔥 ຖືກຕິດຕໍ່ກັນ: '+streak;
setTimeout(newQuiz,1500);
}
load();
</script>
</body>
</html>
