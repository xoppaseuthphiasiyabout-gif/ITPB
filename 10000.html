let ALL=DATA.map((d,i)=>({w:d[0],lao:d[1],ex:d[2],level:Math.floor(i/30)+1}));
let curLevel=1;let score=0;let streak=0;let curQ=null;let mode='learn';
function speakText(t){try{let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=0.8;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}setTimeout(()=>{if(!speechSynthesis.speaking){let a=new Audio('https://translate.google.com/translate_tts?ie=UTF-8&q='+encodeURIComponent(t)+'&tl=en&client=tw-ob');a.play().catch(()=>{});}},400);}
function showMode(m,b){mode=m;document.querySelectorAll('.top button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('learnBox').style.display=m==='learn'?'block':'none';document.getElementById('quizBox').style.display=m==='learn'?'none':'block';if(m!=='learn')newQuiz();}
function setLevel(l,b){curLevel=l;document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');render();}
function render(){
let q=document.getElementById('search').value.toLowerCase();
let list=ALL.filter(o=>o.level===curLevel);
if(q)list=ALL.filter(o=>o.w.includes(q));
document.getElementById('list').innerHTML=list.map(o=>`<div class="card"><div class="word" onclick="speakText('${o.w}')">🔊 ${o.w}</div><div class="mean">🇱🇦 ${o.lao}</div><div class="ex">${o.ex}</div></div>`).join('');
}
function newQuiz(){
let idx=Math.floor(Math.random()*ALL.length);curQ=ALL[idx];
let opts=[curQ.lao];
while(opts.length<4){let w=ALL[Math.floor(Math.random()*ALL.length)].lao;if(!opts.includes(w))opts.push(w);}
opts.sort(()=>Math.random()-0.5);
document.getElementById('quizBox').innerHTML=`<div class="quiz"><div>${mode==='game'?'🎮 ເກມ':'🎯 ຕອບຄຳຖາມ'}</div><h2 style="font-size:32px" onclick="speakText('${curQ.w}')">🔊 ${curQ.w}</h2><p>ຄຳນີ້ແປເປັນລາວວ່າຫຍັງ?</p><p style="color:#64748b">${curQ.ex}</p>${opts.map(o=>`<button class="opt" onclick="checkAns('${o}')">${o}</button>`).join('')}<div id="qResult"></div><button style="padding:12px 20px;border:none;border-radius:14px;background:#2563eb;color:#fff;margin-top:10px" onclick="newQuiz()">ຂໍ້ຕໍ່ໄປ ➡️</button></div>`;
speakText(curQ.w);
}
function checkAns(ans){
if(ans===curQ.lao){score+=10;streak++;document.getElementById('qResult').innerHTML='<h3 style="color:green">✅ ຖືກຕ້ອງ! +10 🎉</h3>';}
else{streak=0;document.getElementById('qResult').innerHTML='<h3 style="color:red">❌ ຜິດ! ຄຳຕອບແມ່ນ: '+curQ.lao+'</h3>';}
document.getElementById('score').innerText='⭐ ຄະແນນ: '+score+' | 🔥 ຖືກຕິດຕໍ່ກັນ: '+streak;
setTimeout(newQuiz,1500);
}
let h='';for(let i=1;i<=10;i++)h+=`<button onclick="setLevel(${i},this)">Level ${i}</button>`;
document.getElementById('levels').innerHTML=h;render();
</script>
</body>
  </html>
