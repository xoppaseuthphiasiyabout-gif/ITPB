<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocab 10000</title>
<style>
body{font-family:sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);margin:0;padding:12px;min-height:100vh}
h1{text-align:center;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.3)}
.top{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.top button{padding:12px 18px;border-radius:20px;border:none;font-weight:bold;background:#fff;color:#667eea;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.top button.active{background:#f59e0b;color:#fff}
input{width:92%;padding:13px;font-size:16px;border-radius:20px;border:none;margin:10px 0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.tabs button{padding:8px 12px;border-radius:20px;border:none;background:rgba(255,255,255,.9)}
.tabs button.active{background:#f59e0b;color:#fff}
.card{background:#fff;padding:16px;margin:8px 0;border-radius:18px;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.word{font-size:26px;font-weight:bold;color:#1e293b;cursor:pointer}
.mean{color:#059669;font-size:17px}.ex{color:#64748b}
.quiz{background:#fff;padding:20px;border-radius:20px;text-align:center}
.quiz h2{font-size:32px}
.opt{display:block;width:100%;padding:14px;margin:8px 0;border-radius:14px;border:2px solid #e2e8f0;background:#f8fafc;font-size:17px}
.score{color:#fff;text-align:center;font-weight:bold}
</style>
</head>
<body>
<h1>📚 Vocab 10,000</h1>
<div class="score" id="score">⭐ ຄະແນນ: 0 | 🔥 ຕອບຖືກຕິດຕໍ່ກັນ: 0</div>
<div class="top">
<button id="btnLearn" class="active" onclick="showMode('learn',this)">📖 ຮຽນ</button>
<button onclick="showMode('quiz',this)">🎯 ຕອບຄຳຖາມ</button>
<button onclick="showMode('game',this)">🎮 ເກມ</button>
</div>
<div id="learnBox">
<input id="search" placeholder="🔍 ຄົ້ນຫາ..." oninput="render()">
<div class="tabs" id="levels"></div>
<div id="list">ກຳລັງໂຫຼດ...</div>
</div>
<div id="quizBox" style="display:none"></div>
<script>
let ALL=[];let curLevel=1;let score=0;let streak=0;let curQ=null;let mode='learn';
function speakText(t){
  try{
    let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=0.8;
    u.onend=()=>{};speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){}
  // ສຳຮອງສຳລັບ Messenger - ໃຊ້ສຽງຈາກ Google
  setTimeout(()=>{
    if(!speechSynthesis.speaking){
      let a=new Audio('https://translate.google.com/translate_tts?ie=UTF-8&q='+encodeURIComponent(t)+'&tl=en&client=tw-ob');
      a.play().catch(()=>{});
    }
  },400);
}
async function load(){
try{
let r=await fetch('https://raw.githubusercontent.com/dwyl/english-words/master/words_alpha.txt');
let t=await r.text();
let words=t.split('\n').map(s=>s.trim()).filter(w=>w.length>=4&&w.length<=7&&/^[a-z]+$/.test(w));
for(let i=words.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[words[i],words[j]]=[words[j],words[i]];}
words=words.slice(0,10000);
ALL=words.map((w,i)=>({w:w,level:Math.floor(i/1000)+1,mean:'ຄຳສັບທີ '+(i+1),ex:'Example: I use "'+w+'" every day.'}));
}catch(e){}
let h='';for(let i=1;i<=10;i++)h+=`<button onclick="setLevel(${i},this)">Level ${i}</button>`;
document.getElementById('levels').innerHTML=h;render();newQuiz();
}
function showMode(m,b){
mode=m;document.querySelectorAll('.top button').forEach(x=>x.classList.remove('active'));b.classList.add('active');
document.getElementById('learnBox').style.display=m==='learn'?'block':'none';
document.getElementById('quizBox').style.display=m==='learn'?'none':'block';
if(m!=='learn')newQuiz();
}
function setLevel(l,b){curLevel=l;document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');render();}
function render(){
let q=document.getElementById('search').value.toLowerCase();
let list=ALL.filter(o=>o.level===curLevel);
if(q)list=ALL.filter(o=>o.w.includes(q));
list=list.slice(0,50);
document.getElementById('list').innerHTML=list.map(o=>`<div class="card"><div class="word" onclick="speakText('${o.w}')">🔊 ${o.w}</div><div class="mean">${o.mean}</div><div class="ex">${o.ex}</div><div style="color:#f59e0b">👆 ກົດໃສ່ຄຳສັບເພື່ອຟັງສຽງ</div></div>`).join('');
}
function newQuiz(){
if(ALL.length<4)return;
let idx=Math.floor(Math.random()*ALL.length);curQ=ALL[idx];
let opts=[curQ.w];
while(opts.length<4){let w=ALL[Math.floor(Math.random()*ALL.length)].w;if(!opts.includes(w))opts.push(w);}
opts.sort(()=>Math.random()-0.5);
let isGame=mode==='game';
document.getElementById('quizBox').innerHTML=`<div class="quiz">
<div style="font-size:14px;color:#888">${isGame?'🎮 ເກມ - ທາຍໃຫ້ໄວ!':'🎯 ຕອບຄຳຖາມ'}</div>
<h2 onclick="speakText('${curQ.w}')">🔊 ${curQ.w}</h2>
<p>ຄຳນີ້ແປວ່າຫຍັງ? ກົດເພື່ອຟັງສຽງ 👆</p>
<p style="color:#059669">${curQ.mean} - ${curQ.ex}</p>
${opts.map(o=>`<button class="opt" onclick="checkAns('${o}')">${o}</button>`).join('')}
<div id="qResult"></div>
<button style="padding:12px 20px;border:none;border-radius:14px;background:#2563eb;color:#fff;margin-top:10px" onclick="newQuiz()">ຂໍ້ຕໍ່ໄປ ➡️</button>
</div>`;
speakText(curQ.w);
}
function checkAns(ans){
if(ans===curQ.w){score+=10;streak++;document.getElementById('qResult').innerHTML='<h3 style="color:green">✅ ຖືກຕ້ອງ! +10 ຄະແນນ 🎉</h3>';speakText('Correct! Great job');}
else{streak=0;document.getElementById('qResult').innerHTML='<h3 style="color:red">❌ ຜິດ! ຄຳຕອບແມ່ນ: '+curQ.w+'</h3>';}
document.getElementById('score').innerText='⭐ ຄະແນນ: '+score+' | 🔥 ຕອບຖືກຕິດຕໍ່ກັນ: '+streak;
setTimeout(newQuiz,1500);
}
load();
</script>
</body>
</html>
