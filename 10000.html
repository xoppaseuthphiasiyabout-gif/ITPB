<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocab 10000</title>
<style>
body{font-family:sans-serif;background:#f0f4ff;margin:0;padding:10px}
h1{text-align:center;color:#2563eb}
input{width:95%;padding:12px;font-size:16px;border-radius:10px;border:1px solid #ccc}
.tabs{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin:10px 0}
button{padding:10px 12px;border:none;border-radius:10px;background:#2563eb;color:#fff}
button.active{background:#f59e0b}
.card{background:#fff;padding:14px;margin:8px 0;border-radius:14px}
.word{font-size:22px;font-weight:bold;cursor:pointer}
.mean{color:#059669}.ex{color:#555}
</style>
</head>
<body>
<h1>📚 Vocab 10,000</h1>
<input id="search" placeholder="🔍 ຄົ້ນຫາ..." oninput="render()">
<div class="tabs" id="levels"></div>
<div id="list">ກຳລັງໂຫຼດ...</div>
<script>
let ALL=[];let curLevel=1;
async function load(){
try{
let r=await fetch('https://raw.githubusercontent.com/dwyl/english-words/master/words_alpha.txt');
let t=await r.text();
let words=t.split('\n').map(s=>s.trim()).filter(w=>w.length>=3&&w.length<=8);
words=words.slice(0,10000);
ALL=words.map((w,i)=>({w:w,level:Math.floor(i/1000)+1,mean:'ຄຳສັບທີ '+(i+1),ex:'Example: I use the word "'+w+'" every day.'}));
}catch(e){
let base="the of and to in is you that it he was for on are as with his they I at be this have from or one had by word but not what all were we when your can said there use an each which she do how their if will up other about out many then them these so some her would make like him into time has look two more write go see number no way could people my than first water been call who oil its now find long down day did get come made may part".split(" ");
ALL=base.map((w,i)=>({w:w,level:1,mean:'ຄຳສັບທີ '+(i+1),ex:'Example: I use the word "'+w+'" every day.'}));
}
let h='';for(let i=1;i<=10;i++)h+=`<button onclick="setLevel(${i},this)">Level ${i}</button>`;
document.getElementById('levels').innerHTML=h;render();
}
function setLevel(l,b){curLevel=l;document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');render();}
function speakText(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=0.8;speechSynthesis.speak(u);}
function render(){
let q=document.getElementById('search').value.toLowerCase();
let list=ALL.filter(o=>o.level===curLevel);
if(q)list=ALL.filter(o=>o.w.includes(q));
list=list.slice(0,100);
document.getElementById('list').innerHTML=list.map(o=>`<div class="card"><div class="word" onclick="speakText('${o.w}')">${o.w} 👆 ກົດເພື່ອຟັງສຽງ</div><div class="mean">${o.mean}</div><div class="ex">${o.ex}</div></div>`).join('');
}
load();
</script>
</body>
</html>
